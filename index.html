/* Layout: 장표의 연장. 어두운 상단 바 + 탭, 좌측 정렬 본문, 레이블 박스·점선 박스는 PPT 마스터 v4 컴포넌트를 따른다 */
:root{
  --red:#E30019; --red-ink:#C80016; --red-tint:#FCE6E8; --red-row:rgba(227,0,25,.08);
  --ink:#1D1E1E; --g80:#4A4B4B; --g65:#6C6D6D; --g40:#A5A5A5; --g20:#D2D2D2; --g10:#E8E9E9;
  --bg:#FFFFFF; --surface:#F6F6F6; --bar:#1D1E1E; --bar-fg:#FFFFFF; --bar-dim:#A5A5A5;
  --good:#1F7A4D; --warn:#B26A00;
  --grad:linear-gradient(90deg,#FF7000,#E30019,#DE007E);
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#FF3347; --red-ink:#FF5A6B; --red-tint:#3A1519; --red-row:rgba(255,51,71,.16);
  --ink:#ECEDED; --g80:#C9CACA; --g65:#9D9E9E; --g40:#6C6D6D; --g20:#3A3B3B; --g10:#2A2B2B;
  --bg:#141515; --surface:#1D1E1E; --bar:#0C0D0D; --bar-fg:#FFFFFF; --bar-dim:#8A8B8B;
  --good:#4CC38A; --warn:#E3A33B; color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#FF3347; --red-ink:#FF5A6B; --red-tint:#3A1519; --red-row:rgba(255,51,71,.16);
  --ink:#ECEDED; --g80:#C9CACA; --g65:#9D9E9E; --g40:#6C6D6D; --g20:#3A3B3B; --g10:#2A2B2B;
  --bg:#141515; --surface:#1D1E1E; --bar:#0C0D0D; --bar-fg:#FFFFFF; --bar-dim:#8A8B8B;
  --good:#4CC38A; --warn:#E3A33B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;letter-spacing:-0.01em;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg)}
.bar .wrap{display:flex;align-items:center;gap:24px;min-height:56px;flex-wrap:wrap}
.mark{display:flex;align-items:center;flex-shrink:0}
.logo{display:block;height:26px;width:auto}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav::-webkit-scrollbar{display:none}
nav a{display:block;padding:17px 12px 15px;font-size:14px;color:var(--bar-dim);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
nav a:hover{color:var(--bar-fg)}
nav a[aria-current="page"]{color:var(--bar-fg);font-weight:600;border-bottom-color:var(--red)}
nav a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* page head */
.head{padding-block:40px 28px;border-bottom:1px solid var(--g20)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--red)}
.eyebrow::before{content:"";width:6px;height:6px;background:var(--red)}
h1{font-size:clamp(24px,3.4vw,34px);line-height:1.3;font-weight:700;margin:10px 0 12px;text-wrap:balance;letter-spacing:-0.025em}
h1 em{font-style:normal;color:var(--red)}
.lede{color:var(--g80);max-width:68ch;margin:0;font-size:16px}

main section{padding-block:32px;border-bottom:1px solid var(--g10)}
main section:last-child{border-bottom:0}
h2{font-size:18px;font-weight:700;margin:0 0 4px;letter-spacing:-0.02em}
.sub{color:var(--g65);font-size:13px;margin:0 0 20px}
h3{font-size:15px;font-weight:700;margin:0 0 6px}
p{margin:0 0 10px}

/* label box (PPT component) */
.lbl{display:inline-block;background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;padding:2px 8px;letter-spacing:.02em}
.lbl.red{background:var(--red);color:#fff}

/* value nature chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border:1px solid var(--g20);color:var(--g80);border-radius:2px;white-space:nowrap;vertical-align:middle}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--g40)}
.chip.disc::before{background:var(--ink)}
.chip.press::before{background:var(--g65);border-radius:0}
.chip.obs::before{background:var(--red)}
.chip.calc::before{background:transparent;border:1.5px solid var(--red)}
.chip.rev::before{background:transparent;border:1.5px solid var(--ink);border-radius:0}
.chip.est::before{background:var(--g40);border-radius:0}
.chip.plug::before{background:transparent;border:1px dashed var(--g65);border-radius:0}
.chip.asm::before{background:transparent;border:1.5px solid var(--red);border-radius:0}
.chip.none{border-style:dashed;color:var(--g65)}

/* portfolio scenario */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--g40)}
.seg button{border:0;border-right:1px solid var(--g20);padding:7px 12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.tlabel{font-size:12px;color:var(--g65);margin-right:8px}
.ni{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ni input{width:68px;padding:4px 6px;font:inherit;font-size:13px;text-align:right;border:1px solid var(--g40);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;border-radius:0}
.ni input:hover{border-color:var(--ink)}
.ni input.edited{border-color:var(--red);background:var(--red-row)}
.ni em{font-style:normal;font-size:12px;color:var(--g65)}
tr.grp td{background:var(--surface);font-size:12px;font-weight:700;color:var(--g80);padding-block:6px}
tr.tot td{border-top:2px solid var(--ink);font-weight:700}
tr.sel td{background:var(--red-row)}
tr.yr{cursor:pointer}
tr.yr:hover td{background:var(--surface)}
tr.yr.sel:hover td{background:var(--red-row)}
.mini{position:relative;height:10px;background:var(--g10);min-width:120px}
.mini i{position:absolute;inset:0 auto 0 0;background:var(--g65)}
.mini b{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink)}
.neg{color:var(--red-ink)}
.muted{color:var(--g65)}
.chip.none::before{background:transparent;border:1px dashed var(--g40)}

/* stat row */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;background:var(--g20);border:1px solid var(--g20)}
.stat{background:var(--bg);padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .k{font-size:13px;color:var(--g65)}
.stat .v{font-size:30px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .v small{font-size:15px;font-weight:600;margin-left:2px}
.stat .n{font-size:12px;color:var(--g65)}
.stat.focus .v{color:var(--red)}

/* margin chart */
.mchart{display:flex;flex-direction:column;gap:18px;margin-top:6px}
.mrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:16px;align-items:center}
.mrow .who{font-weight:600;font-size:14px;line-height:1.35}
.mrow .who small{display:block;color:var(--g65);font-weight:400;font-size:12px}
.track{position:relative;height:30px;background:var(--g10)}
.fill{position:absolute;inset:0 auto 0 0;background:var(--g40)}
.fill.me{background:var(--red)}
.fill span{position:absolute;right:-6px;top:50%;transform:translate(100%,-50%);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.target{position:absolute;top:-8px;bottom:-8px;width:0;border-left:2px dashed var(--ink)}
.target b{position:absolute;top:-20px;left:-1px;transform:translateX(-50%);font-size:11px;white-space:nowrap}
.axis{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:16px;font-size:11px;color:var(--g65)}
.axis div:last-child{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--g20)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--g10);vertical-align:top}
thead th{background:var(--surface);font-weight:600;color:var(--g80);font-size:12.5px;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .src{display:block;font-size:11.5px;color:var(--g65);margin-top:2px}
tr.me td,td.me-col,thead th.me-col,.card.me{background:var(--red-row)}

/* grids */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.cols>*{min-width:0}
.card{border:1px solid var(--g20);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .brand{font-weight:700;font-size:15px}
.card .name{font-size:14px;color:var(--g80);min-height:2.8em}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.price s{color:var(--g65);font-variant-numeric:tabular-nums}
.price .off{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
dl.kv dt{color:var(--g65)}
dl.kv dd{margin:0;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--g65);border-top:1px solid var(--g10);padding-top:10px;margin-top:auto}

.dashed{border:1.5px dashed var(--g40);padding:16px 18px;background:var(--bg)}
.dashed.red{border-color:var(--red)}
.callout{background:var(--surface);padding:18px 20px}
.callout p:last-child{margin:0}
.dlbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.dlbtn{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;padding:8px 16px}
.dlbtn:hover{background:var(--red);border-color:var(--red);color:#fff}
.dlbtn:disabled{opacity:.6;cursor:progress}
.srcline{font-size:12px;color:var(--g65)}

/* status pills */
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.pill.done{background:var(--ink);color:var(--bg)}
.pill.doing{background:var(--red);color:#fff}
.pill.todo{border:1px solid var(--g40);color:var(--g80)}
.pill.hold{border:1px dashed var(--g40);color:var(--g65)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.step{border:1px solid var(--g20);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.step .no{font-size:11px;color:var(--g65);font-weight:600}
.step .t{font-weight:700;font-size:16px}
.step .d{font-size:12.5px;color:var(--g80)}
.meter{height:6px;background:var(--g10)}
.meter i{display:block;height:100%;background:var(--ink)}
.step .c{font-size:12px;color:var(--g65);font-variant-numeric:tabular-nums}
@media (max-width:760px){.pipe{grid-template-columns:1fr 1fr}.mrow,.axis{grid-template-columns:1fr;gap:6px}.axis div:first-child{display:none}}

/* simulator */
.sim{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.sim{grid-template-columns:1fr}}
.ctrl{display:flex;flex-direction:column;gap:18px}
.ctrl label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;gap:8px}
.ctrl label span{font-variant-numeric:tabular-nums;color:var(--red)}
.ctrl .hint{font-size:12px;color:var(--g65);margin-top:2px}
input[type=range]{width:100%;accent-color:var(--red)}
.out{border:1px solid var(--g20);padding:20px;display:flex;flex-direction:column;gap:12px}
.out .big{font-size:44px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1}
.out .big.hit{color:var(--red)}
.out .row{display:flex;justify-content:space-between;font-size:13.5px;border-top:1px solid var(--g10);padding-top:8px;font-variant-numeric:tabular-nums;gap:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--g40);background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink)}

ul.plain{margin:0;padding-left:18px}
ul.plain li{margin-bottom:4px}
details{border-top:1px solid var(--g10);padding-top:10px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--g80)}

footer{background:var(--surface);border-top:1px solid var(--g20);margin-top:24px}
footer .wrap{padding-block:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--g65)}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--g65)}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}
</style>

let PS=null, PYEAR=2031, PPRESET="base";
function presetState(p){
  const P=PRESETS[p], s={g:{},m:{},retA:[...P.retA],retK:[...P.retK],hoka:[...P.hoka],imp:P.imp,fc:P.fc};
  PF.forEach(f=>{s.g[f.k]=P.g[f.k]??0; s.m[f.k]=f.k==="hoka"?P.hokaM:+(f.rate*100).toFixed(4);});
  return s;
}
function calcYear(s,y){
  const t=y-2025, out={};
  PF.forEach(f=>{
    let r;
    if(f.type==="nb"){const b=f.r25*(1+s.g[f.k]/100); r=y===2026?b:y===2031?0:b*(f.k==="nbA"?s.retA:s.retK)[y-2027]/100;}
    else if(f.type==="hoka") r=y===2026?0:s.hoka[y-2027];
    else if(f.type==="folder") r=y===2026?416.303:0;
    else r=f.r25*Math.pow(1+s.g[f.k]/100,t);
    let m=s.m[f.k]/100; if(f.type==="dom"||f.type==="folder") m+=s.imp/100*t;
    out[f.k]={r,o:r*m};
  });
  const nb=y=>PF.filter(f=>f.type==="nb").reduce((a,f)=>a+f.r25*(1+s.g[f.k]/100)*(y===2026?1:y===2031?0:(f.k==="nbA"?s.retA:s.retK)[y-2027]/100),0);
  out.fixed=y>=2027?-(nb(2026)-nb(y))*s.fc/100:0;
  return out;
}
function totals(s,y){
  if(y===2025){const r=PF.reduce((a,f)=>a+f.r25,0), o=PF.reduce((a,f)=>a+f.r25*f.rate,0);
    return {r,o,nb:(PF[0].r25+PF[1].r25)/r,hoka:0};}
  const c=calcYear(s,y), r=PF.reduce((a,f)=>a+c[f.k].r,0), o=PF.reduce((a,f)=>a+c[f.k].o,0)+c.fixed;
  return {r,o,nb:(c.nbA.r+c.nbK.r)/r,hoka:c.hoka.r/r};
}

function bindPortfolio(){
  if(!document.getElementById("pf-years")) return;
  const $=id=>document.getElementById(id);
  const read=inp=>{
    const [k,i]=inp.id.split("-"), v=+inp.value||0;
    if(k==="g"||k==="m") PS[k][i]=v; else if(i!==undefined) PS[k][+i]=v; else PS[k]=v;
  };
  const mark=()=>{
    const d=presetState(PPRESET);
    document.querySelectorAll("#app .ni input").forEach(inp=>{
      const [k,i]=inp.id.split("-"); let v;
      if(k==="g") v=d.g[i]; else if(k==="m") v=+d.m[i].toFixed(2); else if(k==="retA"||k==="retK"||k==="hoka") v=d[k][+i]; else v=d[k];
      inp.classList.toggle("edited",Math.abs((+inp.value)-v)>1e-9);
    });
  };
  const upd=()=>{
    const c=calcYear(PS,PYEAR), T=totals(PS,PYEAR), T25=totals(PS,2025);
    PF.forEach(f=>{
      $("or-"+f.k).textContent=e0(c[f.k].r);
      const o=c[f.k].o; $("oo-"+f.k).textContent=e0(o); $("oo-"+f.k).classList.toggle("neg",o<0);
      const d=c[f.k].r-f.r25; $("od-"+f.k).textContent=(d>0?"+":"")+e0(d); $("od-"+f.k).classList.toggle("neg",d<-0.5);
    });
    $("oo-fixed").textContent=e0(c.fixed); $("oo-fixed").classList.toggle("neg",c.fixed<0);
    $("t-r").textContent=e0(T.r); $("t-o").textContent=e0(T.o)+" · "+pct(T.o/T.r);
    const td=T.r-T25.r; $("t-d").textContent=(td>0?"+":"")+e0(td); $("t-d").classList.toggle("neg",td<0);
    $("h-r").textContent=PYEAR+"E 매출"; $("h-o").textContent=PYEAR+"E 영업이익";
    $("s-k1").textContent=PYEAR+"E 패션 매출"; $("s-r").innerHTML=e0(T.r)+"<small>억</small>";
    $("s-rn").innerHTML=chip("calc")+" 2025 대비 "+(td>0?"+":"")+pct(td/T25.r);
    $("s-k2").textContent=PYEAR+"E 영업이익"; $("s-o").innerHTML=e0(T.o)+"<small>억</small>";
    const od=T.o-2515; $("s-on").innerHTML=chip("calc")+" 2025 대비 "+(od>0?"+":"")+e0(od)+"억";
    $("s-k3").textContent=PYEAR+"E 영업이익률"; $("s-m").innerHTML=(T.o/T.r*100).toFixed(1)+"<small>%</small>";
    const gap=T.r*0.2-T.o; $("s-g").innerHTML=gap>0?e0(gap)+"<small>억</small>":"달성"; $("s-gn").innerHTML=chip("calc")+" 매출 × 20% − 영업이익";
    $("pf-years").innerHTML=[2025,...YEARS].map(y=>{const t=totals(PS,y), m=t.o/t.r;
      return `<tr class="yr ${y===PYEAR?"sel":""}" data-y="${y}" tabindex="${y===2025?-1:0}"><td><b>${y===2025?"2025 실적":y+"E"}</b></td><td class="num">${e0(t.r)}</td><td class="num ${t.o<0?"neg":""}">${e0(t.o)}</td><td class="num"><b>${pct(m)}</b></td>
        <td><div class="mini" role="img" aria-label="${y} 영업이익률 ${pct(m)}"><i style="width:${Math.max(0,Math.min(m,0.25))/0.25*100}%"></i><b style="left:80%"></b></div></td>
        <td class="num">${pct(t.nb)}</td><td class="num">${pct(t.hoka)}</td></tr>`;}).join("");
    mark();
  };
  const setYear=y=>{PYEAR=y; document.querySelectorAll("#pf-year button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.year===y)); upd();};
  document.querySelectorAll("#app .ni input").forEach(i=>i.addEventListener("input",()=>{read(i);upd();}));
  document.querySelectorAll("#pf-year button").forEach(b=>b.addEventListener("click",()=>setYear(+b.dataset.year)));
  $("pf-years").addEventListener("click",e=>{const tr=e.target.closest("tr[data-y]"); if(tr&&+tr.dataset.y>2025) setYear(+tr.dataset.y);});
  $("pf-years").addEventListener("keydown",e=>{const tr=e.target.closest("tr[data-y]"); if(tr&&(e.key==="Enter"||e.key===" ")&&+tr.dataset.y>2025){e.preventDefault();setYear(+tr.dataset.y);}});
  document.querySelectorAll("#pf-preset button").forEach(b=>b.addEventListener("click",()=>{PPRESET=b.dataset.preset; PS=presetState(PPRESET); render();}));
  upd();
}

const CY0=1.36, CY1=6.07;
function contentSlide(s,ny0,ny1){
  const k=(ny1-ny0)/(CY1-CY0), cy=y=>y>=CY0-.3?ny0+(y-CY0)*k:y;
  const map=o=>{ const n=Object.assign({},o); if(typeof n.y==="number"){ n.y=cy(n.y); if(typeof n.h==="number") n.h*=k; }
    if(typeof n.rowH==="number") n.rowH*=k; else if(Array.isArray(n.rowH)) n.rowH=n.rowH.map(v=>v*k); return n; };
  return {addText:(t,o)=>s.addText(t,map(o)),addShape:(t,o)=>s.addShape(t,map(o)),addTable:(r,o)=>s.addTable(r,map(o)),addImage:o=>s.addImage(map(o))};
}
const TAKE={outline:{fill:K.white,line:K.red,text:K.red},dark:{fill:K.ink,line:K.ink,text:K.white},red:{fill:K.red,line:K.red,text:K.white}};

function pfEdited(){
  const d=presetState(PPRESET), ed=new Set();
  PF.forEach(f=>{ if(Math.abs(PS.g[f.k]-d.g[f.k])>1e-9) ed.add("g-"+f.k); if(Math.abs(+PS.m[f.k].toFixed(2)-+d.m[f.k].toFixed(2))>1e-9) ed.add("m-"+f.k); });
  ["retA","retK","hoka"].forEach(k=>PS[k].forEach((v,i)=>{ if(Math.abs(v-d[k][i])>1e-9) ed.add(k+"-"+i); }));
  ["imp","fc"].forEach(k=>{ if(Math.abs(PS[k]-d[k])>1e-9) ed.add(k); });
  return ed;
}

  [["합산 매출",e0(rev)+"억"],["합산 영업이익",e0(op)+"억"],["20%까지 남은 이익",gap>0?e0(gap)+"억":"달성"],["국내 / 해외 이익 비중",Math.round(dp/tot*100)+" / "+Math.round(op_/tot*100)]].forEach(([l,v],i)=>{
    const y=3.3+i*.24;
    s.addShape("line",{x:8.07,y,w:4.9,h:0,line:{color:K.g10,width:.75}});
    s.addText(l,T({x:8.07,y,w:2.8,h:.24,fontSize:10,valign:"middle"}));
    s.addText(v,T({x:10.87,y,w:2.1,h:.24,fontSize:10.5,bold:true,align:"right",valign:"middle"}));
  });

  // 아래: 검증할 개선 가설 (웹사이트 표와 같은 4개 열)
  colHead(s,"검증할 개선 가설",.37,4.38,12.6);
  const H=[["할인 깊이와 기간을 줄여도 판매가 유지된다","표시가 할인율, 할인 스타일 비중, 기간한정 빈도","실제 결제가·할인 부담액·상품별 마진"],
           ["상품군별 구색 수를 줄이면 재고 손실이 줄어든다","상품군별 스타일 수, 신규 관측 수, 옵션 구매 가능 비중","발주·재고·폐기, 스타일별 수익성"],
           ["반복되는 불만 주제를 고치면 반품이 줄어든다","주제별 부정 비중 (사이즈·핏, 품질)","반품 사유·상담 기록·재구매"],
           ["온라인 PB 경쟁에는 콘텐츠 반응이 선행한다","무신사 PB 제품매출 +33.6%, 콘텐츠 게시·반응","광고비·유입·전환·고객 확보 비용"]];
  s.addTable([[thc("가설"),thc("공개 관측 근거"),thc("내부 검증 자료"),thc("상태","center")],
    ...H.map(h=>[cell(h[0],{bold:true}),cell(h[1]),cell(h[2]),cell("제안",{align:"center",color:K.g80})])],

const DECKS={overview:{name:"종합비교",build:deckOverview},portfolio:{name:"포트폴리오_시나리오",build:deckPortfolio},levers:{name:"수익레버",build:deckLevers}};
function makeDeck(view,logo){
  const pptx=new PptxGenJS(); pptx.layout="LAYOUT_WIDE"; pptx.author="조은희"; pptx.title="이랜드월드 "+DECKS[view].name;
  pptx.theme={headFontFace:FF,bodyFontFace:FF}; DECKS[view].build(pptx,logo); return pptx;
}
async function bindDownload(view){
  const btn=document.getElementById("dl-btn"); if(!btn||!DECKS[view]) return;
  btn.hidden=false;
  const openHint=`<a href="${SITE_URL}" target="_blank" rel="noopener">claude.ai에서 페이지를 새로 열고</a> 다시 눌러 주세요`;
  btn.onclick=async()=>{
    const msg=document.getElementById("dl-msg"); btn.disabled=true; msg.textContent="PPT를 만드는 중입니다";
    try{
      await loadPptx();
      const logo=(document.querySelector(".logo")?.src||"").replace(/^data:/,"");
      const blob=await makeDeck(view,logo).write({outputType:"blob"});
      const filename=`이랜드월드_${DECKS[view].name}.pptx`;
      const dl=await DLP;
      if(dl){
        await dl.save({filename,data:blob});
        msg.textContent="저장했습니다";
      }else{
        // 저장 권한이 없는 화면(단독 페이지 등)에서는 일반 다운로드를 시도하고 안내를 남긴다
        const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
        document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},5000);
        if(window.claude) msg.innerHTML="다운로드가 시작되지 않으면 "+openHint; else msg.textContent="PPT 파일을 내려받았습니다";
      }
    }catch(e){
      const c=e&&e.code;
      if(c==="declined") msg.textContent="저장을 취소했습니다";
      else if(c==="rate_limited") msg.textContent="저장 창이 이미 열려 있습니다. 잠시 후 다시 눌러 주세요";
      else if(e&&e.message==="load") msg.textContent="PPT 도구를 불러오지 못했습니다. 네트워크를 확인하고 다시 눌러 주세요";
      else msg.innerHTML="이 화면에서는 저장할 수 없습니다. "+openHint;
    }finally{ btn.disabled=false; }
  };
}

/* ---------- router ---------- */
const app=document.getElementById("app");
const ORDER=["overview","portfolio","levers","product","response"];
function bindSim(){
  const $=id=>document.getElementById(id);
  const dm=$("dm"); if(!dm) return;
  const om=$("om"), dg=$("dg");
  const DREV=18258, OREV=17309;
  const upd=()=>{
    const d=+dm.value, o=+om.value, g=+dg.value; LV.d=d; LV.o=o; LV.g=g;
    const dr=DREV*(1+g/100), dp=dr*d/100, opv=OREV*o/100, rev=dr+OREV, op=dp+opv, m=op/rev*100;
    $("dmv").textContent=d.toFixed(1)+"%"; $("omv").textContent=o.toFixed(1)+"%"; $("dgv").textContent=(g>0?"+":"")+g+"%";
    $("tot").textContent=m.toFixed(1)+"%"; $("tot").classList.toggle("hit",m>=19.95);
    $("rv").textContent=won(Math.round(rev))+"억"; $("op").textContent=won(Math.round(op))+"억";
    const gap=rev*0.2-op; $("gp").textContent=gap>0?won(Math.round(gap))+"억":"달성";
    const t=Math.abs(dp)+Math.abs(opv)||1; $("sh").textContent=Math.round(dp/t*100)+" / "+Math.round(opv/t*100);
  };
  [dm,om,dg].forEach(x=>x.addEventListener("input",upd));
  document.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{const [a,c,e]=b.dataset.p.split(",");dm.value=a;om.value=c;dg.value=e;upd();}));
  upd();
}
function render(){
  let v=location.hash.slice(1); if(!ORDER.includes(v)) v="overview";
  app.innerHTML=V[v]();
  document.querySelectorAll("#nav a").forEach(a=>{
    if(a.getAttribute("href")==="#"+v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
  bindSim();
  bindPortfolio();
  bindDownload(v);
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});
render();
</script>
